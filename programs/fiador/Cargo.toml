[package]
name = "fiador"
version = "0.1.0"
description = "Fiador.sol — garantia locatícia on-chain"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "fiador"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022", "associated_token"] }

[dev-dependencies]
litesvm = "0.16.0"
litesvm-token = "0.16.0"
solana-message = "4.4.1"
solana-transaction = { version = "4.1.6", features = ["blake3"] }
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
